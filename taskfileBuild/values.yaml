## @section taskfile.build parameters
ingress:
  ## @param ingress.enabled Enable or disable the ingress
  enabled: true
  ## @param ingress.className The class name for the ingress
  className: ""
  ## @param ingress.clusterIssuerRef The cluster issuer reference for the ingress
  clusterIssuerRef: ""
  ## @param ingress.host The host for the ingress
  host: ""
  ## @param ingress.customDomain The custom domain for the ingress
  customDomain: ""

## @section taskfile.build parameters
## @param image The image for taskfile.build
image: "mintsystem/taskfile.build:latest"
## @param imagePullPolicy Pull policy for taskfile.build image
imagePullPolicy: Always
## @param gitUrl Repo url to pull.
gitUrl: ""
## @param taskCommands Run this commands with the task file.
taskCommands: ""
## @param caddyRoot Static site path relative to repo root.
caddyRoot: ""
## @param additionalEnvs Additional environment variables to set
additionalEnvs: {}
## @param storageClassName Set the storage class
storageClassName: ""
## @section Resources requests and limits
resources:
  ## @param resources.requests.memory Memory request for the container
  requests:
    memory: "500Mi"
    ## @param resources.requests.cpu CPU request for the container
    cpu: "100m"
  limits:
    ## @param resources.limits.memory Memory limit for the container
    memory: "1Gi"