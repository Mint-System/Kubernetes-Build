## @section Postgres parameters
# -- Enable or disable Postgres
enabled: true
# -- The Docker image for Postgres
image: postgres:16-alpine
# -- The port for Postgres
port: 5432
# -- The database name for Postgres
db: postgres
# -- The username for Postgres
user: postgres
# -- If not set a password will be generated
password:
# -- The secret reference for Postgres
secretRef: postgres
# -- The user password key for Postgres
userPasswordKey: "password"
# -- Set the storage class
storageClassName: ""
## @section Resources requests and limits
resources:
  requests:
    # -- Memory request for the container
    memory: "500Mi"
    # -- CPU request for the container
    cpu: "100m"
  limits:
    # -- Memory limit for the container
    memory: "1Gi"
