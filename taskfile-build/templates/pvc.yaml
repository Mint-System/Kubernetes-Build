apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-taskfile-build
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.storageSize | default "1Gi" }}
  {{- if .Values.storageClassName }}
  storageClassName: {{ .Values.storageClassName }}
  {{- end }}
