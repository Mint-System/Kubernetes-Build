## @section taskfile.build parameters
ingress:
  # -- Enable or disable the ingress
  enabled: true
  # -- The class name for the ingress
  className: ""
  # -- The cluster issuer reference for the ingress
  clusterIssuerRef: ""
  # -- The host for the ingress
  host: ""
  # -- The custom domain for the ingress
  customDomain: ""
  # -- Redirect the customDomain without www to the customDomain
  wwwRedirect: false
  # -- Redirect this domain to the customDomain
  redirectFrom: ""

## @section taskfile.build parameters
# -- The image for taskfile.build
image: "mintsystem/taskfile.build:latest"
# -- Pull policy for taskfile.build image
imagePullPolicy: Always
# -- Repo url to pull.
gitUrl: ""
# -- Run this commands with the task file.
taskCommands: ""
# -- Static site path relative to repo root.
caddyRoot: ""
# -- Additional environment variables to set
additionalEnvs: {}
# -- Set the storage class
storageClassName: ""
# -- Set the persistent volume claim size
storageSize: "1Gi"
## @section Resources requests and limits
resources:
  requests:
    # -- Memory request for the container
    memory: "500Mi"
    # -- CPU request for the container
    cpu: "100m"
  limits:
    # -- Memory limit for the container
    memory: "1Gi"