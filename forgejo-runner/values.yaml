## @section  Forgejo Runner parameters
# -- The image for  Forgejo Runner
image: code.forgejo.org/forgejo/runner:9
# -- Pull policy for  Forgejo Runner image
imagePullPolicy: Always
# -- Forgejo instance url.
forgejoInstanceUrl: https://codeberg.org
# -- The secret reference for the Forgejo Runner
secretRef: forgejo-runner
# -- Set the storage class
storageClassName: ""
## @section Resources requests and limits
resources:
  requests:
    # -- Memory request for the container
    memory: "500Mi"
    # -- CPU request for the container
    cpu: "100m"
  limits:
    # -- Memory limit for the container
    memory: "1Gi"
