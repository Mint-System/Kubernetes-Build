[project]
site_url = "https://kubernetes.build/"
site_name = "Kubernetes Build"
site_description = "The Mint System collection of Helm Charts."

repo_url = "https://github.com/Mint-System/Kubernetes-Build"
repo_name = "Mint-System/Kubernetes-Build"

nav = [
  { "Home" = "index.md" },
  { "Charts" = [
    { "Charts" = "Charts.md" },
    { "cluster-issuer" = "cluster-issuer/README.md" },
    { "deployment-updater" = "deployment-updater/README.md" },
    { "forgejo-runner" = "forgejo-runner/README.md" },
    { "nextcloud" = "nextcloud/README.md" },
    { "odoo" = "odoo/README.md" },
    { "postgres" = "postgres/README.md" },
    { "prometheus-agent" = "prometheus-agent/README.md" },
    { "taskfile-build" = "taskfile-build/README.md" },
    { "vshn-postgres" = "vshn-postgres/README.md" },
  ]},
  { "Clusters" = [
    { "Clusters" = "Clusters.md" },
    { "APPUiO" = "APPUiO.md" },
    { "Exoscale" = "Exoscale.md" },
    { "Infomaniak" = "Infomaniak.md" },
    { "K3s" = "K3s.md" },
    { "Backup" = "Backup.md" },
    { "Monitor" = "Monitor.md" },
    { "Migration" = "Migration.md" },
  ]},
  { "Development" = "Development.md" },
]

extra_css = ["assets/custom.css"]

[project.theme]
logo = "icon.png"
language = "en"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  # "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/Mint-System/Kubernetes-Build"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
