## @section Ingress parameters
##
ingress:
  # -- Enable or disable the ingress
  enabled: true
  # -- The class name for the ingress
  className: ""
  # -- The cluster issuer reference for the ingress
  clusterIssuerRef:
  # -- The host for the ingress
  host: ""
  # -- The custom domain for the ingress
  customDomain: ""
  # -- Redirect the customDomain without www to the customDomain
  wwwRedirect: false
  # -- Redirect this domain to the customDomain
  redirectFrom: ""

## @section Remark42 parameters
# -- The image for Remark42
image: "umputun/remark42:latest"
# -- Pull policy for Remark42 image
imagePullPolicy: Always
# -- The Remark42 URL (REMARK_URL)
url: ""
# -- The Remark42 site id (SITE)
site: ""
# -- Name of the secret containing Remark42 secrets
secretName: ""
# -- Additional environment variables to set
additionalEnvs: {}
# -- Set the storage class
storageClassName: ""
# -- Set the persistent volume claim size
storageSize: "1Gi"

## @section Auth parameters
auth:
  # -- Enable anonymous auth (AUTH_ANON)
  anonymous: "false"
  # -- Enable email auth (AUTH_EMAIL_enable)
  emailEnabled: "false"
  # -- Email auth from address (AUTH_EMAIL_FROM)
  emailFrom: ""
  # -- Same site auth (AUTH_SAME_SITE)
  sameSite: none
  github:
    # -- GitHub auth client id (AUTH_GITHUB_CSEC)
    cid: ""
  custom:
    # -- Custom auth name (AUTH_CUSTOM_NAME)
    name: ""
    # -- Custom auth client id (AUTH_CUSTOM_CID)
    cid: ""
    # -- Custom auth url (AUTH_CUSTOM_AUTH_URL)
    authUrl: ""
    # -- Custom auth token url (AUTH_CUSTOM_TOKEN_URL)
    tokenUrl: ""
    # -- Custom auth info url (AUTH_CUSTOM_INFO_URL)
    infoUrl: ""
    # -- Custom auth scopes (AUTH_CUSTOM_SCOPES)
    scopes: ""

## @section SMTP parameters
smtp:
  # -- SMTP host (SMTP_HOST)
  host: ""
  # -- SMTP port (SMTP_PORT)
  port: "587"
  # -- SMTP username (SMTP_USERNAME)
  username: ""
  # -- Enable SMTP TLS (SMTP_TLS)
  tls: "true"

## @section Admin parameters
admin:
  # -- Admin shared email (ADMIN_SHARED_EMAIL)
  sharedEmail: ""
  # -- Admin shared id (ADMIN_SHARED_ID)
  sharedId: ""

## @section Notify parameters
notify:
  # -- Notify type (NOTIFY_TYPE)
  type: email
  # -- Notify email from address (NOTIFY_EMAIL_FROM)
  emailFrom: ""
  # -- Notify email admin (NOTIFY_EMAIL_ADMIN)
  emailAdmin: "true"
## @section Resources requests and limits
resources:
  requests:
    # -- Memory request for the container
    memory: "256Mi"
    # -- CPU request for the container
    cpu: "100m"
  limits:
    # -- Memory limit for the container
    memory: "512Mi"

## @section K8up parameters
k8up:
  # -- Enable or disable K8up
  enabled: false
  # -- S3 endpoint
  endpoint: ""
  # -- S3 bucket name
  bucket: ""
