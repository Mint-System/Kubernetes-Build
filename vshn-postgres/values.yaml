## @section vshn-postgres parameters
##
# -- Enable or disable vshn-postgres
##
enabled: false
# -- The secret reference for vshn-postgres
##
secretRef: postgres-creds
client:
  # -- Enable or disable the vshn-postgres client
  ##
  enabled: false
## @section Resources requests and limits
resources:
  requests:
    # -- Memory request for the container
    memory: "500Mi"
    # -- CPU request for the container
    cpu: "100m"
  limits:
    # -- Memory limit for the container
    memory: "1Gi"
