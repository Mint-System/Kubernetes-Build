## @section Ingress parameters
ingress:
  # -- Enable or disable the ingress
  enabled: true
  # -- The class name for the ingress
  className: ""
  # -- The cluster issuer reference for the ingress
  clusterIssuerRef:
  # -- The host for the ingress
  host: ""

## @section Nextcloud parameters
nextcloud:
  # -- Enable or disable Nextcloud
  enabled: true
  ingress:
    # -- Enable or disable the Nextcloud subchart ingress
    enabled: false
  nextcloud:
    # -- The host for Nextcloud and Ingress
    host: ""
    # -- Use an existing secret for credentials
    existingSecret:
      # -- Enable or disable using an existing secret
      enabled: true
      # -- Name of the existing Kubernetes secret
      secretName: nextcloud-creds
    mail:
      # -- Whether to enable/disable email settings
      enabled: true
  # -- Enable persistence using PVC
  persistence: 
    enabled: true
  phpClientHttpsFix:
    # -- Fix HTTPS protocol detection behind reverse proxy
    enabled: true
  internalDatabase:
    # -- Enable or disable the internal SQLite database
    enabled: false
  redis:
    # -- Enable or disable the bitnami Redis subchart
    enabled: false
    auth:
      # -- Enable or disable Redis authentication
      enabled: false
  externalRedis:
    # -- Enable or disable external Redis
    enabled: true
    # -- Hostname or service name of the external Redis
    host: nextcloud-redis
  externalDatabase:
    # -- Enable or disable external database usage
    enabled: true
    # -- Type of external database (e.g., postgresql, mysql)
    type: postgresql
    # -- Hostname or service name of the external database
    host: nextcloud-postgresql-rw
    # -- Name of the database to use
    database: nextcloud
    existingSecret:
      # -- Enable or disable using an existing secret for database credentials
      enabled: true
      # -- Name of the existing Kubernetes secret
      secretName: nextcloud-postgresql-app
      # -- Key in the secret containing the database username
      usernameKey: username
      # -- Key in the secret containing the database password
      passwordKey: password
  resources:
    requests:
      # -- Memory request for the container
      memory: "1Gi"
      # -- CPU request for the container
      cpu: "250m"
    limits:
      # -- Memory limit for the container
      memory: "2Gi"

## @section Redis parameters
redis:
  # -- Enable or disable Redis
  enabled: true
  # -- The image for Redis
  image: redis:alpine

## @section CloudNativePG parameters
cnpg:
  # -- Enable or disable CloudNativePG
  enabled: true
  # -- Number of instances (1 for single, 2+ for high availability)
  instances: 1
  # -- PostgreSQL image to use
  imageName: ghcr.io/cloudnative-pg/postgresql:16.0
  storage:
    # -- Persistent volume size for each instance
    size: 8Gi
  # -- Name of the CloudNativePG database to create
  database: nextcloud
  # -- Name of the database user
  owner: app

## @section K8up parameters
k8up:
  # -- Enable or disable K8up
  enabled: false
  # -- S3 endpoint
  endpoint: ""
  # -- S3 bucket name
  bucket: ""