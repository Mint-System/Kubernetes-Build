## @section Ingress parameters
##
ingress:
  # -- Enable or disable the ingress
  enabled: true
  # -- The class name for the ingress
  className: ""
  # -- The cluster issuer reference for the ingress
  clusterIssuerRef:
  # -- The host for the ingress
  host: ""
  # -- The custom domain for the ingress
  customDomain: ""
  staging:
    # -- The custom domain for the staging ingress
      customDomain: ""

## @section vshnPostgres parameters
vshnPostgres:
  # -- Enable or disable vshnPostgres
  enabled: false
  # -- The secret reference for vshnPostgres
  secretRef: odoo-postgresql
  client:
    # -- Enable or disable the vshnPostgres client
    enabled: false

## @section Postgres parameters
postgres:
  # -- Enable or disable Postgres
  enabled: false
  # -- The database name for Postgres
  db: odoo
  # -- The username for Postgres
  user: odoo
  # -- The secret reference for Postgres
  secretRef: odoo-postgres
  # -- Set the storage class
  storageClassName: standard

## @section CloudNativePG parameters
cnpg:
  # -- Enable or disable CloudNativePG
  enabled: true
  # -- Override the name of the CloudNativePG cluster
  ## Default: "{release-name}-postgresql"
  nameOverride: ""
  # -- Number of instances (1 for single, 2+ for high availability)
  instances: 1
  storage:
    # -- Persistent volume size for each instance
    size: 8Gi
  # -- Name of the CloudNativePG database to create
  database: odoo
  # -- Name of the database user
  owner: app

## @section Odoo parameters
# -- Enable or disable Odoo
enabled: true
# -- The image for Odoo
image: ""
# -- Number of Odoo replicas
replicas: 1
# -- Pull policy for Odoo image
imagePullPolicy: Always
# -- Enable or disable proxy mode for Odoo
proxyMode: true
# -- Enable or disable downloading Odoo Enterprise
downloadOdooEnterprise: false
# -- List of addon Git repositories for Odoo
addonsGitRepos:
  - https://github.com/Mint-System/Odoo-Apps-Server-Tools.git
  - https://github.com/OCA/Server-Tools.git
# -- List of python packages to insall
pythonInstall: []
# -- The database for odoo
database: odoo
init:
  # -- The initial language for Odoo
  lang: de_CH
  # -- The initial username for Odoo admin account
  login: ""
  # -- The initial passwod for Odoo admin account
  password: ""
# -- Enable or disable listing databases for Odoo
listDB: false
# -- Define the amount of Odoo workers to spawn
workers: 5
# -- The secret reference for Odoo
secretRef: odoo-creds
# -- Set the storage class
storageClassName: ""
## @section Resources requests and limits
resources:
  requests:
    # -- Memory request for the container
    memory: "1Gi"
    # -- CPU request for the container
    cpu: "250m"
  limits:
    # -- Memory limit for the container
    memory: "2Gi"

## @section K8up parameters
k8up:
  # -- Enable or disable K8up
  enabled: false
  # -- S3 endpoint
  endpoint: ""
  # -- S3 bucket name
  bucket: ""

## @section Staging parameters
staging:
  # -- Enable or disable staging deployment
  enabled: false
  # -- The image for Odoo staging
  image: ""
  # -- Name of the staging environment (used in staging ingress)
  name: staging

## @section Upgrade parameters
upgrade:
  # -- Enable or disable the upgrade job
  enabled: false
  # -- The image for the Odoo upgrade job
  image: mintsystem/odoo-upgrade:16
  # -- The target database for the upgrade
  targetDatabase: upgrade
  # -- The target Odoo version for the upgrade
  targetVersion: ""
  # -- The upgrade mode (test or production)
  mode: test